<title>WORLD ÉLITE — Real Estate &amp; Lifestyle</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&amp;family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&amp;display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C9A84C;
  --gold-light: #F5D77A;
  --gold-dark: #8B6014;
  --gold-ultra: #FFE680;
  --void: #000005;
  --void-warm: #0D0800;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--void); }

#three-canvas {
  position: fixed;
  inset: 0;
  display: block;
  z-index: 1;
}

#intro-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: var(--void);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 1.2s ease;
}
#intro-overlay.fade-out { opacity: 0; pointer-events: none; }

.intro-ring {
  position: relative;
  width: 120px;
  height: 120px;
  animation: introSpin 2s linear infinite;
}
.intro-ring svg { width: 100%; height: 100%; }
@keyframes introSpin { to { transform: rotate(360deg); } }
.intro-wordmark {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  font-family: 'Cinzel', serif;
  font-size: 0.5rem;
  letter-spacing: 0.35em;
  color: var(--gold);
  white-space: nowrap;
}

#flash-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: radial-gradient(ellipse at center, rgba(255,230,128,0.6) 0%, rgba(201,168,76,0.2) 40%, transparent 70%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease;
}
#flash-overlay.active { opacity: 1; }

#ui-overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

#logo-top {
  position: absolute;
  top: 1vh;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  opacity: 0;
  transition: opacity 1.8s ease, transform 1.8s ease;
  transform: translateX(-50%) translateY(-16px);
}
#logo-top.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.crown-svg-top {
  width: 68px;
  height: auto;
  margin: 0 auto 10px;
  display: block;
  filter: drop-shadow(0 0 12px rgba(245,215,122,0.5));
}

.logo-center-img{
  height: 150px;
}
.logo-center-img-small{
  height: 100px;
}

.we-wordmark {
  font-family: 'Cinzel', serif;
  font-weight: 900;
  font-size: clamp(1.1rem, 2.8vw, 1.8rem);
  letter-spacing: 0.55em;
  background: linear-gradient(135deg, #C9A84C 0%, #F5D77A 45%, #E8C252 65%, #C9A84C 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-indent: 0.55em;
}
.we-tagline {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(0.6rem, 1.3vw, 0.78rem);
  letter-spacing: 0.3em;
  color: var(--gold);
  opacity: 0.65;
  margin-top: 5px;
}

.region-badge {
  position: fixed;
  display: flex;
  align-items: center;
  gap: 7px;
  opacity: 0;
  transition: opacity 0.6s ease;
  pointer-events: none;
  transform: translate(-50%, -50%);
}
.region-badge.visible { opacity: 1; }
.badge-pulse {
  position: relative;
  width: 10px;
  height: 10px;
}
.badge-pulse::before,
.badge-pulse::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--gold-light);
}
.badge-pulse::before { animation: badgePulse 2.2s ease-out infinite; }
.badge-pulse::after { transform: scale(0.5); }
@keyframes badgePulse {
  0% { transform: scale(0.5); opacity: 1; }
  100% { transform: scale(3); opacity: 0; }
}
.badge-text {
  font-family: 'Cinzel', serif;
  font-size: 0.55rem;
  font-weight: 600;
  letter-spacing: 0.2em;
  color: var(--gold-light);
  text-shadow: 0 0 15px rgba(245,215,122,0.8);
  white-space: nowrap;
}

#logo-center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.7);
  text-align: center;
  opacity: 0;
  transition: opacity 1.2s ease, transform 1.4s cubic-bezier(0.16,1,0.3,1);
  pointer-events: none;
}
#logo-center.visible {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}
.crown-svg-center {
  width: 120px;
  height: auto;
  margin: 0 auto 16px;
  display: block;
  filter: drop-shadow(0 0 30px rgba(245,215,122,0.7)) drop-shadow(0 0 60px rgba(201,168,76,0.4));
  animation: crownGlow 3s ease-in-out infinite;
}
@keyframes crownGlow {
  0%, 100% { filter: drop-shadow(0 0 30px rgba(245,215,122,0.7)) drop-shadow(0 0 60px rgba(201,168,76,0.4)); }
  50% { filter: drop-shadow(0 0 50px rgba(255,230,128,0.9)) drop-shadow(0 0 100px rgba(245,215,122,0.5)); }
}
.we-wordmark-large {
  font-family: 'Cinzel', serif;
  font-weight: 900;
  font-size: clamp(1.8rem, 5vw, 3.2rem);
  letter-spacing: 0.55em;
  text-indent: 0.55em;
  background: linear-gradient(135deg, #C9A84C 0%, #F5D77A 35%, #FFE680 50%, #F5D77A 65%, #C9A84C 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.we-tagline-large {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(0.75rem, 1.6vw, 1rem);
  letter-spacing: 0.3em;
  color: var(--gold);
  opacity: 0.75;
  margin-top: 10px;
}

.section-label {
  position: fixed;
  font-family: 'Cinzel', serif;
  font-weight: 600;
  font-size: clamp(0.5rem, 1.1vw, 0.7rem);
  letter-spacing: 0.35em;
  color: var(--gold-light);
  opacity: 0;
  transition: opacity 0.8s ease;
  pointer-events: none;
  white-space: nowrap;
  transform: translate(-50%, -50%);
  text-shadow: 0 0 20px rgba(245,215,122,0.9), 0 0 40px rgba(201,168,76,0.5);
}
.section-label.visible { opacity: 1; }
.section-label::before {
  content: '◆';
  font-size: 0.4em;
  margin-right: 8px;
  vertical-align: middle;
  opacity: 0.7;
}

.nav-line { width: 1px; height: 16px; background: rgba(201,168,76,0.35); flex-shrink: 0; }

#main-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  padding: 2.5rem 3rem;
  background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 1s ease, transform 1s ease;
  pointer-events: none;
}
#main-nav.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: all;
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  flex-wrap: wrap;
  row-gap: 0.75rem;
}
nav a {
  font-family: 'Cinzel', serif;
  font-size: clamp(0.55rem, 1vw, 0.68rem);
  font-weight: 600;
  letter-spacing: 0.22em;
  color: rgba(201,168,76,0.75);
  text-decoration: none;
  padding: 0.4rem 1.5rem;
  transition: color 0.3s, text-shadow 0.3s;
  white-space: nowrap;
}
nav a:hover {
  color: var(--gold-ultra);
  text-shadow: 0 0 20px rgba(245,215,122,0.6);
}

#scroll-hint {
  position: fixed;
  bottom: 5.5rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  text-align: center;
  opacity: 0;
  transition: opacity 1.2s ease;
  pointer-events: none;
}
#scroll-hint.visible { opacity: 1; }
#scroll-hint span {
  display: block;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 0.72rem;
  letter-spacing: 0.25em;
  color: rgba(201,168,76,0.5);
  margin-bottom: 8px;
}
.scroll-chevrons {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.scroll-chevrons span {
  display: block;
  width: 12px;
  height: 6px;
  border-right: 1px solid rgba(201,168,76,0.4);
  border-bottom: 1px solid rgba(201,168,76,0.4);
  transform: rotate(45deg);
  animation: chevronFall 2s ease-in-out infinite;
}
.scroll-chevrons span:nth-child(2) { animation-delay: 0.2s; opacity: 0.6; }
.scroll-chevrons span:nth-child(3) { animation-delay: 0.4s; opacity: 0.3; }
@keyframes chevronFall {
  0%, 100% { transform: rotate(45deg) translateY(0); opacity: 0.8; }
  50% { transform: rotate(45deg) translateY(4px); opacity: 0.4; }
}

#phase-subtitle {
  position: fixed;
  bottom: 12vh;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 0.9rem;
  letter-spacing: 0.3em;
  color: rgba(245,215,122,0.6);
  opacity: 0;
  transition: opacity 0.8s ease;
  pointer-events: none;
  white-space: nowrap;
  z-index: 15;
}
#phase-subtitle.visible { opacity: 1; }

<script>
'use strict';

let W = window.innerWidth, H = window.innerHeight;

function getResponsiveProfile() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const aspect = w / Math.max(h, 1);
  const portrait = aspect < 0.85;
  const mobile = w <= 767;
  const smallMobile = w <= 480;
  const shortLandscape = h <= 620 && aspect > 1.2;

  return {
    w, h, aspect, portrait, mobile, smallMobile, shortLandscape,
    fov: shortLandscape ? 58 : smallMobile ? 62 : mobile ? 58 : portrait ? 54 : 48,

(function buildStars() {
  const count = 3500;
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 90 + Math.random() * 150;
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
    const warm = Math.random();
    col[i*3]   = warm > 0.85 ? 1.0 : 0.82 + Math.random()*0.18;
    col[i*3+1] = warm > 0.85 ? 0.88 : 0.82 + Math.random()*0.18;
    col[i*3+2] = warm > 0.85 ? 0.55 : 0.9 + Math.random()*0.1;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({ size: 0.18, vertexColors: true, transparent: true, opacity: 0.9, sizeAttenuation: true });
  const stars = new THREE.Points(geo, mat);
  stars.name = 'stars';
  scene.add(stars);
})();

// GLOBE TEXTURE — Reference image style:
//   OCEAN = near-black void (dark background)
//   LAND  = bright polished gold, raised, metallic with subtle texture
//   Grid lines = warm amber lines over ocean, subtle on land
// ══════════════════════════════════════════════════════════════════
function buildGlobeTexture() {
  const cw = 4096, ch = 2048;
  const cv = document.createElement('canvas');
  cv.width = cw; cv.height = ch;
  const ctx = cv.getContext('2d');

  // ── BASE: Very dark ocean — almost black with faint warm tint ──
  ctx.fillStyle = '#050200';
  ctx.fillRect(0, 0, cw, ch);

  // Very subtle warm tint gradient on ocean (matches reference dark background)
  const oceanTint = ctx.createRadialGradient(cw*0.5, ch*0.5, 0, cw*0.5, ch*0.5, cw*0.7);
  oceanTint.addColorStop(0,   'rgba(30,12,2,0.6)');
  oceanTint.addColorStop(0.5, 'rgba(15,5,0,0.4)');
  oceanTint.addColorStop(1,   'rgba(0,0,0,0.8)');
  ctx.fillStyle = oceanTint;
  ctx.fillRect(0, 0, cw, ch);

  function ll(lat, lon) {
    return [((lon + 180) / 360) * cw, ((90 - lat) / 180) * ch];
  }
  function getBBox(pts) {
    let minLat=90,maxLat=-90,minLon=180,maxLon=-180;
    pts.forEach(([la,lo]) => {
      if(la<minLat)minLat=la; if(la>maxLat)maxLat=la;
      if(lo<minLon)minLon=lo; if(lo>maxLon)maxLon=lo;
    });
    return {minLat,maxLat,minLon,maxLon};
  }

  // ── DRAW LAND: Bright polished gold, raised metallic look ──
  function drawLand(pts) {
    ctx.save();
    ctx.beginPath();
    const [sx, sy] = ll(pts[0][0], pts[0][1]);
    ctx.moveTo(sx, sy);
    for (let i = 1; i < pts.length; i++) {
      const [x, y] = ll(pts[i][0], pts[i][1]);
      ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.clip();

    const bbox = getBBox(pts);
    const [x1, y1] = ll(bbox.maxLat, bbox.minLon);
    const [x2, y2] = ll(bbox.minLat, bbox.maxLon);
    const cx2 = (x1+x2)/2, cy2 = (y1+y2)/2;
    const w2 = Math.abs(x2-x1), h2 = Math.abs(y2-y1);

    // Base gold fill — rich warm gold like reference
    const baseGold = ctx.createLinearGradient(x1, y1, x2, y2);
    baseGold.addColorStop(0,   '#C8860C');
    baseGold.addColorStop(0.25,'#E8A820');
    baseGold.addColorStop(0.5, '#D49010');
    baseGold.addColorStop(0.75,'#B07010');
    baseGold.addColorStop(1,   '#8B5008');
    ctx.fillStyle = baseGold;
    ctx.fillRect(0, 0, cw, ch);

    // Light-side highlight (upper-right is brighter — matches reference key light)
    const highlight = ctx.createRadialGradient(
      cx2 + w2*0.3, cy2 - h2*0.35, 0,
      cx2 + w2*0.1, cy2 - h2*0.1, Math.max(w2, h2)*0.9
    );
    highlight.addColorStop(0,   'rgba(255,230,130,0.75)');
    highlight.addColorStop(0.2, 'rgba(240,190,80,0.45)');
    highlight.addColorStop(0.5, 'rgba(200,140,30,0.15)');
    highlight.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = highlight;
    ctx.fillRect(0, 0, cw, ch);

    // Shadow side (lower-left darker)
    const shadow = ctx.createRadialGradient(
      cx2 - w2*0.4, cy2 + h2*0.4, 0,
      cx2 - w2*0.2, cy2 + h2*0.2, Math.max(w2, h2)*0.8
    );
    shadow.addColorStop(0,   'rgba(0,0,0,0.55)');
    shadow.addColorStop(0.4, 'rgba(0,0,0,0.25)');
    shadow.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = shadow;
    ctx.fillRect(0, 0, cw, ch);

    // Subtle cracked/rough texture — thin dark lines
    const numCracks = 60 + Math.floor(Math.random() * 50);
    for (let v = 0; v < numCracks; v++) {
      const vx = x1 + Math.random() * w2;
      const vy = y1 + Math.random() * h2;
      const vLen = 6 + Math.random() * 22;
      const vAngle = Math.random() * Math.PI * 2;
      const t2 = Math.random();
      ctx.beginPath();
      ctx.moveTo(vx, vy);
      ctx.lineTo(vx + Math.cos(vAngle)*vLen, vy + Math.sin(vAngle)*vLen);
      if (t2 > 0.65) {
        // Bright highlight crack
        ctx.strokeStyle = `rgba(255,${210+Math.floor(Math.random()*45)},${80+Math.floor(Math.random()*60)},${0.25+Math.random()*0.35})`;
        ctx.lineWidth = 0.4 + Math.random() * 0.8;
      } else {
        // Dark shadow crack
        ctx.strokeStyle = `rgba(0,0,0,${0.25+Math.random()*0.4})`;
        ctx.lineWidth = 0.5 + Math.random() * 1.5;
      }
      ctx.stroke();
    }

    // Scattered specular dots — tiny bright points simulating rough gold surface
    for (let s = 0; s < 120; s++) {
      const sx2 = x1 + Math.random()*w2;
      const sy2 = y1 + Math.random()*h2;
      if (Math.random() > 0.5) {
        const r2 = 0.8 + Math.random()*2.5;
        const g2 = ctx.createRadialGradient(sx2,sy2,0,sx2,sy2,r2);
        g2.addColorStop(0, `rgba(255,${220+Math.floor(Math.random()*35)},${100+Math.floor(Math.random()*80)},${0.5+Math.random()*0.5})`);
        g2.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g2;
        ctx.beginPath(); ctx.arc(sx2,sy2,r2,0,Math.PI*2); ctx.fill();
      }
    }

    ctx.restore();
  }

  // ── CONTINENT DATA ──
  const continents = [

    [[58,5],[62,5],[65,14],[68,18],[70,20],[70,28],[68,28],[65,26],[60,25],[57,22],[56,12],[58,10],[58,5]],
    [[37,-6],[37,12],[32,25],[30,32],[22,37],[15,42],[12,44],[11,42],[4,40],[1,42],[-2,42],[-5,40],[-10,40],[-15,36],[-20,35],[-26,33],[-30,30],[-35,26],[-34,18],[-28,17],[-22,14],[-18,12],[-15,12],[-10,15],[-5,10],[0,8],[4,-2],[5,-5],[4,-8],[5,-15],[6,-16],[14,-17],[20,-17],[28,-15],[32,-2],[30,5],[30,12],[32,20],[37,-6]],
    [[30,32],[32,36],[28,48],[22,60],[15,52],[12,45],[22,37],[30,32]],
    [[70,30],[70,70],[72,100],[70,130],[65,140],[58,142],[50,140],[45,135],[40,130],[38,122],[30,120],[25,120],[20,110],[15,108],[10,104],[5,103],[1,104],[1,100],[5,98],[10,98],[15,100],[22,100],[22,90],[20,85],[15,80],[8,77],[12,72],[18,72],[22,68],[22,60],[25,55],[30,50],[30,48],[35,45],[40,45],[38,42],[37,37],[42,35],[42,40],[45,42],[50,50],[55,55],[60,60],[65,65],[70,30]],

    [[-70,-180],[-70,-90],[-70,0],[-70,90],[-70,180],[-75,150],[-80,90],[-85,0],[-80,-90],[-75,-150],[-70,-180]],
  ];

  continents.forEach(pts => drawLand(pts));

  // Islands
  drawLand([[31,130],[34,131],[36,136],[36,138],[35,140],[34,136],[32,132],[30,130]]);
  drawLand([[38,140],[40,140],[42,140],[44,144],[44,146],[42,145],[40,142],[38,141]]);
  drawLand([[5,95],[5,98],[1,104],[0,108],[-5,110],[-8,115],[-8,118],[-5,118],[1,110],[5,108],[8,104],[10,100],[8,98],[5,95]]);
  drawLand([[-36,174],[-38,175],[-42,174],[-46,168],[-44,168],[-40,172],[-36,174]]);

  // ── LAND BORDER — bright gold outline where land meets dark ocean ──
  function strokeLand(pts) {
    ctx.beginPath();
    const [sx, sy] = ll(pts[0][0], pts[0][1]);
    ctx.moveTo(sx, sy);
    for (let i = 1; i < pts.length; i++) {
      const [x, y] = ll(pts[i][0], pts[i][1]);
      ctx.lineTo(x, y);
    }
    ctx.closePath();
    // Bright amber-gold border

  }
  continents.forEach(pts => strokeLand(pts));

  // ── GRID LINES — thin amber on dark ocean, barely visible ──

    const [x, y] = ll(lat, lon);

    ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI*2);
    ctx.fillStyle = d; ctx.fill();
  }
  texGlow(36, 15);
  texGlow(18, -70);
  texGlow(25, 55);

  return new THREE.CanvasTexture(cv);
}

function buildMetalnessTexture() {

  const cv = document.createElement('canvas');
  cv.width = cw; cv.height = ch;
  const ctx = cv.getContext('2d');

  ctx.fillStyle = '#181818';
  ctx.fillRect(0, 0, cw, ch);

  function ll(lat, lon) {
    return [((lon + 180) / 360) * cw, ((90 - lat) / 180) * ch];
  }
  function metLand(pts) {
    ctx.beginPath();
    const [sx, sy] = ll(pts[0][0], pts[0][1]);
    ctx.moveTo(sx, sy);
    for (let i = 1; i < pts.length; i++) {
      const [x, y] = ll(pts[i][0], pts[i][1]);
      ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = '#F0F0F0'; 
    ctx.fill();
  }

  const c4 = [
    [[72,-140],[74,-100],[72,-85],[68,-85],[62,-65],[47,-53],[44,-60],[42,-70],[35,-75],[25,-80],[15,-88],[10,-83],[8,-77],[10,-85],[18,-102],[22,-106],[30,-110],[32,-118],[40,-124],[48,-124],[55,-130],[60,-140],[65,-145],[70,-158],[72,-140]],
    [[12,-72],[12,-62],[10,-62],[5,-52],[2,-50],[0,-50],[-5,-35],[-10,-37],[-15,-39],[-20,-40],[-23,-43],[-28,-48],[-33,-53],[-38,-58],[-42,-63],[-50,-68],[-55,-65],[-55,-70],[-50,-74],[-42,-74],[-35,-72],[-28,-70],[-20,-70],[-10,-76],[-5,-81],[0,-80],[5,-77],[10,-75],[12,-72]],
    [[71,28],[70,22],[65,14],[58,8],[52,2],[51,8],[48,15],[45,13],[41,12],[38,12],[36,5],[36,-6],[38,-9],[42,-9],[44,-2],[48,-5],[48,-2],[52,5],[54,10],[56,10],[57,22],[60,25],[65,26],[68,28],[71,28]],
    [[37,-6],[37,12],[32,25],[30,32],[22,37],[15,42],[12,44],[11,42],[4,40],[1,42],[-2,42],[-5,40],[-10,40],[-15,36],[-20,35],[-26,33],[-30,30],[-35,26],[-34,18],[-28,17],[-22,14],[-18,12],[-15,12],[-10,15],[-5,10],[0,8],[4,-2],[5,-5],[4,-8],[5,-15],[6,-16],[14,-17],[20,-17],[28,-15],[32,-2],[30,5],[30,12],[32,20],[37,-6]],
    [[70,30],[70,70],[72,100],[70,130],[65,140],[58,142],[50,140],[45,135],[40,130],[38,122],[30,120],[25,120],[20,110],[15,108],[10,104],[5,103],[1,104],[1,100],[5,98],[10,98],[15,100],[22,100],[22,90],[20,85],[15,80],[8,77],[12,72],[18,72],[22,68],[22,60],[25,55],[30,50],[30,48],[35,45],[40,45],[38,42],[37,37],[42,35],[42,40],[45,42],[50,50],[55,55],[60,60],[65,65],[70,30]],
    [[-15,130],[-12,136],[-15,142],[-20,148],[-25,152],[-30,152],[-35,150],[-38,146],[-38,140],[-36,136],[-34,135],[-32,134],[-28,130],[-22,115],[-18,122],[-15,130]],
  ];
  c4.forEach(pts => metLand(pts));
  return new THREE.CanvasTexture(cv);
}


const GLOBE_R = 1.9;
const globeTex     = buildGlobeTexture();
const bumpTex      = buildBumpTexture();
const roughTex     = buildRoughnessTexture();
const metalnessTex = buildMetalnessTexture();


const pmremGenerator = new THREE.PMREMGenerator(renderer);
pmremGenerator.compileEquirectangularShader();

const envScene = new THREE.Scene();
const envSphere = new THREE.Mesh(
  new THREE.SphereGeometry(50, 32, 32),
  new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true })
);
const envGeo = envSphere.geometry;
const envColors = [];
const envPos2 = envGeo.attributes.position;
for (let i = 0; i < envPos2.count; i++) {
  const y = envPos2.getY(i);
  const norm = (y + 50) / 100;
  if (norm > 0.7) {
    envColors.push(1.0, 0.78, 0.15); 
  } else if (norm > 0.4) {
    envColors.push(0.75, 0.42, 0.04); 
  } else if (norm > 0.15) {
    envColors.push(0.35, 0.15, 0.01); 
  } else {
    envColors.push(0.04, 0.01, 0.0); 
  }
}
envGeo.setAttribute('color', new THREE.Float32BufferAttribute(envColors, 3));
envScene.add(envSphere);


const envSpot = new THREE.Mesh(
  new THREE.SphereGeometry(4, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xFFF0CC })
);
envSpot.position.set(25, 18, 12);
envScene.add(envSpot);

const envMap = pmremGenerator.fromScene(envScene).texture;
scene.environment = envMap;

const globeMat = new THREE.MeshStandardMaterial({
  map: globeTex,
  bumpMap: bumpTex,
  bumpScale: 0.06,
  roughnessMap: roughTex,
  roughness: 0.2,
  metalnessMap: metalnessTex,
  metalness: 1.0,
  envMap: envMap,
  envMapIntensity: 2.2,
  transparent: true,
  opacity: 1.0
});

const globe = new THREE.Mesh(new THREE.SphereGeometry(GLOBE_R, 128, 128), globeMat);
scene.add(globe);


const atmosMat = new THREE.ShaderMaterial({
  uniforms: {
    glowColor: { value: new THREE.Color(0xD4780A) },
    viewVector: { value: camera.position.clone() }
  },
  vertexShader: `
    uniform vec3 viewVector;
    varying float intensity;
    void main() {
      vec3 vNormal = normalize(normalMatrix * normal);
      vec3 vNormel = normalize(normalMatrix * viewVector);
      intensity = pow(0.50 - dot(vNormal, vNormel), 5.0);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 glowColor;
    varying float intensity;
    void main() {
      vec3 glow = glowColor * intensity;
      gl_FragColor = vec4(glow, intensity * 0.95);
    }`,
  side: THREE.FrontSide,
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthWrite: false
});
const atmos = new THREE.Mesh(new THREE.SphereGeometry(GLOBE_R + 0.12, 64, 64), atmosMat);
scene.add(atmos);


const haloMat = new THREE.ShaderMaterial({
  uniforms: { glowColor: { value: new THREE.Color(0xB06008) } },
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 glowColor;
    varying vec3 vNormal;
    void main() {
      float i = pow(1.0 - abs(dot(vNormal, vec3(0,0,1))), 5.0);
      gl_FragColor = vec4(glowColor, i * 0.35);
    }`,
  side: THREE.BackSide,
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthWrite: false
});
const halo = new THREE.Mesh(new THREE.SphereGeometry(GLOBE_R + 0.8, 48, 48), haloMat);
scene.add(halo);


function makeGlowSprite(r,g,b) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  const gr = ctx.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0, `rgba(${r},${g},${b},1)`);
  gr.addColorStop(0.15,`rgba(${r},${g},${b},0.8)`);
  gr.addColorStop(0.4, `rgba(${r},${g},${b},0.3)`);
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gr; ctx.fillRect(0,0,128,128);
  const tex = new THREE.CanvasTexture(c);
  return new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
}

function ll3D(lat, lon, r) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

const medSpr   = makeGlowSprite(255,220,100);
const caribSpr = makeGlowSprite(255,220,100);
const dubaiSpr = makeGlowSprite(255,220,100);

medSpr.position.copy(ll3D(36, 15, GLOBE_R + 0.02));
caribSpr.position.copy(ll3D(18, -70, GLOBE_R + 0.02));
dubaiSpr.position.copy(ll3D(25, 55, GLOBE_R + 0.02));

[medSpr, caribSpr, dubaiSpr].forEach(s => { s.scale.set(1.0, 1.0, 1.0); globe.add(s); });


const PC = 6000;
const pPos    = new Float32Array(PC * 3);
const pStart  = new Float32Array(PC * 3);
const pTarget = new Float32Array(PC * 3);

for (let i = 0; i < PC; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.acos(2 * Math.random() - 1);
  const r = GLOBE_R;
  pPos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  pPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  pPos[i*3+2] = r * Math.cos(phi);
}
pStart.set(pPos);

const pColors = new Float32Array(PC * 3);
for (let i = 0; i < PC; i++) {
  const b = 0.65 + Math.random() * 0.35;
  pColors[i*3] = b; pColors[i*3+1] = b*0.82; pColors[i*3+2] = b*0.28;
}

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos.slice(), 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

const pMat = new THREE.PointsMaterial({
  size: 0.035, vertexColors: true, transparent: true,
  opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
});
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

function setParticleTargets(mode) {
  pStart.set(pGeo.attributes.position.array);
  if (mode === 'explode') {
    for (let i = 0; i < PC; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 2.5 + Math.random() * 3.5;
      pTarget[i*3]   = r * Math.sin(phi) * Math.cos(theta);
      pTarget[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
      pTarget[i*3+2] = r * Math.cos(phi);
    }
  } else if (mode === 'crown') {
    const crownPts = [];
    for (let x = -2.5; x <= 2.5; x += 0.04) crownPts.push([x, -0.8, 0]);
    for (let t = 0; t <= 1; t += 0.02) crownPts.push([-2.5 + t*0.8, -0.8 + t*3, 0]);
    for (let t = 0; t <= 1; t += 0.02) crownPts.push([-1.7 + t*0.6, 2.2 - t*1.2, 0]);
    for (let t = 0; t <= 1; t += 0.02) crownPts.push([-1.1 + t*0.6, 1.0 + t*1.8, 0]);
    for (let t = 0; t <= 1; t += 0.02) crownPts.push([-0.5 + t*0.5, 2.8 - t*1.2, 0]);
    for (let t = 0; t <= 1; t += 0.02) crownPts.push([0, 1.6 + t*0.6, 0]);
    for (let t = 0; t <= 1; t += 0.02) crownPts.push([0.5 + t*0.5, 2.8 - t*1.2, 0]);
    for (let t = 0; t <= 1; t += 0.02) crownPts.push([1.0 + t*0.6, 1.0 + t*1.8, 0]);
    for (let t = 0; t <= 1; t += 0.02) crownPts.push([1.6 + t*0.6, 2.2 - t*1.2, 0]);
    const text = 'WORLD ÉLITE';
    for (let ci = 0; ci < text.length; ci++) {
      const a = (ci / (text.length-1) - 0.5) * Math.PI * 0.8;
      const r = 3.0;
      for (let j = 0; j < 20; j++) {
        const ja = a + (Math.random()-0.5)*0.08;
        crownPts.push([r*Math.sin(ja)+(Math.random()-0.5)*0.1, -r*Math.cos(ja)*0.4 - 1.5+(Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1]);
      }
    }
    for (let i = 0; i < PC; i++) {
      const idx = Math.floor(Math.random() * crownPts.length);
      const pt = crownPts[idx];
      pTarget[i*3]   = pt[0] + (Math.random()-0.5)*0.06;
      pTarget[i*3+1] = pt[1] + (Math.random()-0.5)*0.06;
      pTarget[i*3+2] = (pt[2]||0) + (Math.random()-0.5)*0.06;
    }
  }
}


const introOverlay = document.getElementById('intro-overlay');
const flashEl      = document.getElementById('flash-overlay');
const logoTop      = document.getElementById('logo-top');
const logoCtr      = document.getElementById('logo-center');
const mainNav      = document.getElementById('main-nav');
const scrollHint   = document.getElementById('scroll-hint');
const phaseSub     = document.getElementById('phase-subtitle');
const badgeMed     = document.getElementById('badge-med');
const badgeCarib   = document.getElementById('badge-carib');
const badgeDubai   = document.getElementById('badge-dubai');
const lblRE        = document.getElementById('lbl-re');
const lblYachts    = document.getElementById('lbl-yachts');
const lblLife      = document.getElementById('lbl-lifestyle');
const lblBL        = document.getElementById('lbl-borderless');
const lblPI        = document.getElementById('lbl-private');
const lblCon       = document.getElementById('lbl-concierge');

const eio  = t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
const eOut = t => 1 - Math.pow(1-t, 3);
const lerp = (a,b,t) => a+(b-a)*t;

const PHASES   = { IDLE:1, ZOOM:2, DISSOLVE:3, FORM:4, INTERIOR:5, SETTLED:6 };
const PHASE_DUR = { 1:4000, 2:3200, 3:2200, 4:3200, 5:4500, 6:99999 };

let phase = 0, phaseT0 = 0, globalMs = 0, started = false;
const camTarget = new THREE.Vector3(0, viewport.homeY, viewport.homeZ);
const tmpV = new THREE.Vector3();

function project(sprite, cam) {
  sprite.getWorldPosition(tmpV);
  tmpV.project(cam);
  return {
    x: (tmpV.x * 0.5 + 0.5) * window.innerWidth,
    y: (-tmpV.y * 0.5 + 0.5) * window.innerHeight,
    vis: tmpV.z < 1.0 && tmpV.z > 0
  };
}
function updateBadge(el, pt) {
  if (pt.vis) { el.style.left = pt.x + 'px'; el.style.top = pt.y + 'px'; }
}
function flash() {
  flashEl.classList.add('active');
  setTimeout(() => flashEl.classList.remove('active'), 350);
}
function showSubtitle(text, dur) {
  phaseSub.textContent = text;
  phaseSub.classList.add('visible');
  if (dur) setTimeout(() => phaseSub.classList.remove('visible'), dur);
}

function enterPhase(p) {
  phase = p; phaseT0 = globalMs;
  switch (p) {
    case PHASES.IDLE:
      logoTop.classList.add('visible');
      setTimeout(() => { badgeMed.classList.add('visible'); badgeCarib.classList.add('visible'); badgeDubai.classList.add('visible'); }, 1000);
      showSubtitle('Three regions. One world.', 3500);
      break;
    case PHASES.ZOOM:
      badgeMed.classList.remove('visible'); badgeCarib.classList.remove('visible'); badgeDubai.classList.remove('visible');
      phaseSub.classList.remove('visible');
      logoTop.style.transition = 'opacity 1.5s'; logoTop.style.opacity = '0';
      camTarget.set(viewport.zoomX, viewport.zoomY, viewport.zoomZ);
      showSubtitle('A gateway to the extraordinary', 3000);
      break;
    case PHASES.DISSOLVE:
      setParticleTargets('explode'); pMat.opacity = 0.9; flash(); phaseSub.classList.remove('visible');
      globeMat.transparent = true;
      break;
    case PHASES.FORM:
      setParticleTargets('crown'); camTarget.set(0, viewport.formY, viewport.homeZ); showSubtitle('', 0);
      break;
    case PHASES.INTERIOR:
      logoCtr.classList.add('visible'); pMat.opacity = 0; camTarget.set(0, viewport.interiorY, viewport.interiorZ);
      const orb = [['50%','22%'],['50%','78%'],['18%','50%'],['82%','50%'],['25%','28%'],['75%','72%']];
      [lblRE, lblYachts, lblLife, lblBL, lblPI, lblCon].forEach((el,i) => {
        el.style.left = orb[i][0]; el.style.top = orb[i][1];
        setTimeout(() => el.classList.add('visible'), 600 + i*250);
      });
      showSubtitle('Where elegance meets the world', 4000);
      break;
    case PHASES.SETTLED:
      mainNav.classList.add('visible'); scrollHint.classList.add('visible');
      [lblRE, lblYachts, lblLife, lblBL, lblPI, lblCon].forEach(el => el.classList.remove('visible'));
      phaseSub.classList.remove('visible');
      break;
  }
}

let lastTs = 0;
function animate(ts) {
  if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', syncResponsiveViewport, { passive: true });
}

requestAnimationFrame(animate);
  const dt = Math.min(ts - lastTs, 50);
  lastTs = ts;

  if (!started) {
    if (ts > 2800) {
      started = true;
      introOverlay.classList.add('fade-out');
      setTimeout(() => introOverlay.style.display = 'none', 1400);
      globalMs = 0; phaseT0 = 0;
      enterPhase(PHASES.IDLE);
    }
    renderer.render(scene, camera);
    return;
  }

  globalMs += dt;
  const elapsed = globalMs - phaseT0;
  const dur = PHASE_DUR[phase] || 4000;
  const t = Math.min(elapsed / dur, 1.0);

  if (t >= 1.0 && phase < PHASES.SETTLED) enterPhase(phase + 1);

  const stars = scene.getObjectByName('stars');
  if (stars) { stars.rotation.y += 0.00004; stars.rotation.x += 0.000015; }


  const shinePulse = 0.5 + 0.5 * Math.sin(globalMs * 0.0007);
  const shinePulse2 = 0.5 + 0.5 * Math.sin(globalMs * 0.0013 + 1.2);
  key.intensity = 2.5 + shinePulse * 0.8;
  fill2.intensity = 0.8 + shinePulse2 * 0.5;
  rim.intensity   = 1.2 + shinePulse * 0.5;

  switch (phase) {
    case PHASES.IDLE: {
      globe.rotation.y += 0.0025;
      const ps = 0.75 + 0.35 * Math.sin(globalMs * 0.003);
      medSpr.scale.setScalar(ps); caribSpr.scale.setScalar(ps*0.92); dubaiSpr.scale.setScalar(ps*1.08);
      if (badgeMed.classList.contains('visible')) {
        updateBadge(badgeMed,  project(medSpr, camera));
        updateBadge(badgeCarib, project(caribSpr, camera));
        updateBadge(badgeDubai, project(dubaiSpr, camera));
      }
      globeMat.opacity = 1; pMat.opacity = 0;
      break;
    }
    case PHASES.ZOOM: {
      globe.rotation.y += 0.002;
      camera.position.lerp(camTarget, 0.018);
      if (atmosMat.uniforms) atmosMat.uniforms.viewVector.value.copy(camera.position);
      break;
    }
    case PHASES.DISSOLVE: {
      const dt2 = eio(t);
      globeMat.opacity = Math.max(0, 1 - dt2 * 2.2);
      if (atmosMat.uniforms) atmosMat.uniforms.viewVector.value.copy(camera.position);
      const pArr = pGeo.attributes.position.array;
      for (let i = 0; i < PC; i++) {
        pArr[i*3]   = lerp(pStart[i*3],   pTarget[i*3],   eOut(dt2));
        pArr[i*3+1] = lerp(pStart[i*3+1], pTarget[i*3+1], eOut(dt2));
        pArr[i*3+2] = lerp(pStart[i*3+2], pTarget[i*3+2], eOut(dt2));
      }
      pGeo.attributes.position.needsUpdate = true;
      pMat.opacity = 0.7 + dt2 * 0.2;
      camera.position.lerp(camTarget, 0.015);
      break;
    }
    case PHASES.FORM: {
      const ft = eio(t);
      const pArr = pGeo.attributes.position.array;
      for (let i = 0; i < PC; i++) {
        pArr[i*3]   = lerp(pStart[i*3],   pTarget[i*3],   eOut(ft));
        pArr[i*3+1] = lerp(pStart[i*3+1], pTarget[i*3+1], eOut(ft));
        pArr[i*3+2] = lerp(pStart[i*3+2], pTarget[i*3+2], eOut(ft));
      }
      pGeo.attributes.position.needsUpdate = true;
      pMat.opacity = Math.max(0, 0.85 - ft * 0.6);
      camera.position.lerp(camTarget, 0.012);
      break;
    }
    case PHASES.INTERIOR: {
      const br = globalMs * 0.0003;
      camera.position.x = Math.sin(br*0.7)*0.25;
      camera.position.y = viewport.interiorY + Math.sin(br)*0.15;
      camera.position.z = viewport.interiorZ + Math.sin(br*0.5)*0.2;
      camera.lookAt(0, 0, 0);
      const la = globalMs * 0.0005;
      const labels = [lblRE, lblYachts, lblLife, lblBL, lblPI, lblCon];
      const offsets = [0, Math.PI, Math.PI*0.5, Math.PI*1.5, Math.PI*0.25, Math.PI*1.25];
      labels.forEach((el, i) => {
        if (!el.classList.contains('visible')) return;
        const ang = la + offsets[i];
        el.style.left = (50 + viewport.labelOrbitX * Math.cos(ang)) + '%';
        el.style.top  = (50 + viewport.labelOrbitY * Math.sin(ang)) + '%';
      });
      if (atmosMat.uniforms) atmosMat.uniforms.viewVector.value.copy(camera.position);
      break;
    }
    case PHASES.SETTLED: {
      globe.rotation.y += 0.0008;
      const br = globalMs * 0.0002;
      camera.position.x += (Math.sin(br)*0.15 - camera.position.x)*0.01;
      camera.position.y += (viewport.interiorY + Math.sin(br*0.7)*0.1 - camera.position.y)*0.01;
      camera.lookAt(0, 0, 0);
      if (atmosMat.uniforms) atmosMat.uniforms.viewVector.value.copy(camera.position);
      break;
    }
  }

  renderer.render(scene, camera);
}

function syncResponsiveViewport() {
  W = window.innerWidth;
  H = window.innerHeight;
  viewport = getResponsiveProfile();

  camera.fov = viewport.fov;
  camera.aspect = viewport.aspect;
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(viewport.pixelRatio);
  renderer.setSize(viewport.w, viewport.h, false);

  if (!started) {
    camera.position.set(0, viewport.homeY, viewport.homeZ);
    camTarget.set(0, viewport.homeY, viewport.homeZ);
  } else if (phase === PHASES.IDLE || phase === PHASES.SETTLED) {
    camTarget.set(0, viewport.homeY, viewport.homeZ);
  } else if (phase === PHASES.ZOOM || phase === PHASES.DISSOLVE) {
    camTarget.set(viewport.zoomX, viewport.zoomY, viewport.zoomZ);
  } else if (phase === PHASES.FORM) {
    camTarget.set(0, viewport.formY, viewport.homeZ);
  } else if (phase === PHASES.INTERIOR) {
    camTarget.set(0, viewport.interiorY, viewport.interiorZ);
  }
}

window.addEventListener('resize', syncResponsiveViewport, { passive: true });
window.addEventListener('orientationchange', () => setTimeout(syncResponsiveViewport, 250), { passive: true });

requestAnimationFrame(animate);
</script>
